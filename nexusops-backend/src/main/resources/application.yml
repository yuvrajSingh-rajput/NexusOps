spring:
  application:
    name: nexusops-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

nexusops:
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${LOCAL_STORAGE_DIR:./data/storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:miniopassword}
      bucket-name: ${MINIO_BUCKET_NAME:nexusops-documents}
  ai:
    embedding:
      model: ${EMBEDDING_MODEL:nomic-embed-text}
      dimension: 768
      ollama-url: ${OLLAMA_URL:http://localhost:11434}
  seed:
    demo-data: ${SEED_DEMO_DATA:true}



