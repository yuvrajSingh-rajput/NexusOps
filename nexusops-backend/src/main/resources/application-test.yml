spring:
  datasource:
    url: jdbc:h2:mem:nexusops_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

nexusops:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  cors:
    allowed-origins: "*"
  outbox:
    relay-interval-ms: 3600000
    relay-initial-delay-ms: 3600000

