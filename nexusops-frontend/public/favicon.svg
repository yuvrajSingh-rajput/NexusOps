<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="nexus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="nexus-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="nexus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="32" height="32" rx="7.5" fill="url(#nexus-bg)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />

  <!-- Main NexusOps Sparkle Constellation -->
  <g filter="url(#nexus-shadow)">
    <!-- Primary 4-Point Star -->
    <path
      d="M 14,6.5 Q 14,16.5 4,16.5 Q 14,16.5 14,26.5 Q 14,16.5 24,16.5 Q 14,16.5 14,6.5 Z"
      fill="url(#nexus-spark-grad)"
    />

    <!-- Secondary Accent Star (Top-Right) -->
    <path
      d="M 24,5 Q 24,8.5 21,8.5 Q 24,8.5 24,12 Q 24,8.5 27,8.5 Q 24,8.5 24,5 Z"
      fill="#c7d2fe"
    />

    <!-- Tertiary Ambient Point (Bottom-Right) -->
    <circle cx="23.5" cy="22.5" r="1.25" fill="#a5b4fc" opacity="0.9" />
  </g>
</svg>
